name: Build Windows .exe

# main 브랜치 푸시 → 자동으로 새 버전 태그 + Release 생성 + DART_QuickReport.exe 업로드
# 또는 수동 실행 (workflow_dispatch) 지원
on:
  push:
    branches:
      - main
      - 'claude/**'   # PR 머지 전에도 build artifact 로 미리 검증
    paths:
      - 'dart_qr/**'
      - 'dart_quickreport.py'
      - 'requirements_qr.txt'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '강제 버전 (예: 0.2.3) — 비우면 자동 부여'
        required: false
        default: ''

permissions:
  contents: write   # Release 생성/asset 업로드

concurrency:
  group: build-exe
  cancel-in-progress: false   # 빌드 중복 방지하되 도중 취소는 안 함

# GitHub 의 기본 JS action runtime 을 Node 24 로 강제 (Node 20 은 deprecated).
# 2026-06-02 이후엔 자동 적용되지만 미리 켜 둬서 경고 제거.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            # 0.<run_number>.<short_sha>  → 매 빌드마다 단조 증가
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            V="0.${{ github.run_number }}.${SHA}"
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=v$V"   >> $GITHUB_OUTPUT
          echo "Resolved version: $V"

      - name: Inject version into _version.py
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $now = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm 'UTC'")
          $content = @"
# Auto-generated by GitHub Actions
__version__ = "$v"
__commit__ = "$sha"
__built_at__ = "$now"
"@
          Set-Content -Path dart_qr\_version.py -Value $content -Encoding UTF8
          Get-Content dart_qr\_version.py

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_qr.txt
          pip install pyinstaller

      - name: Build .exe
        shell: bash
        run: |
          # --noupx: UPX 압축을 끄면 Windows Defender/백신이 DLL 을 오탐해
          #          "Failed to load Python DLL" 다이얼로그를 띄우는 케이스를 크게 줄임.
          # --collect-all anthropic: SDK 내부 리소스 누락 방지.
          pyinstaller --onefile --windowed --clean --noupx \
            --name DART_QuickReport \
            --icon=assets/app_icon.ico \
            --add-data "assets/app_icon.ico;assets" \
            --collect-all anthropic \
            --hidden-import=openpyxl \
            --hidden-import=dotenv \
            dart_quickreport.py

      - name: Show artifact
        shell: bash
        run: |
          ls -la dist/
          file dist/DART_QuickReport.exe || true

      - name: Upload artifact (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: DART_QuickReport-${{ steps.ver.outputs.version }}
          path: dist/DART_QuickReport.exe
          if-no-files-found: error
          retention-days: 30

      # Release 자동 생성: 저장소의 default branch 또는 수동 실행에서만.
      # (이 저장소는 default branch 가 main 이 아닐 수도 있으므로 동적 비교)
      - name: Create / update Release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/DART_QuickReport.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
